    <text x="45" y="66" fill="#ffffff" font-family="monospace" font-size="11">TK 1: RHYME CADENCE (HINDI)</text>
    <rect x="230" y="47" width="180" height="30" rx="3" fill="#ffffff"/>
    <text x="240" y="67" fill="#000000" font-family="monospace" font-size="10" font-weight="bold">॥ मात्रा संरेखण ॥</text>
    
    <rect x="30" y="100" width="410" height="45" rx="4" fill="#151924" stroke="#2b3140"/>
    <text x="45" y="126" fill="#ffffff" font-family="monospace" font-size="11">TK 2: VOCAL PITCH (ENGLISH)</text>
    <path d="M 230 125 Q 260 105 290 125 T 350 125 T 410 125" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    
    <rect x="30" y="160" width="410" height="45" rx="4" fill="#151924" stroke="#2b3140"/>
    <text x="45" y="186" fill="#ffffff" font-family="monospace" font-size="11">TK 3: 808 SUB &amp; PERCUSSION</text>
    <rect x="230" y="167" width="30" height="30" fill="#ffffff"/>
    <rect x="280" y="167" width="30" height="30" fill="#ffffff"/>
    <rect x="330" y="167" width="30" height="30" fill="#ffffff"/>
    <rect x="380" y="167" width="30" height="30" fill="#ffffff"/>
    
    <!-- Spectrogram Visual -->
    <rect x="30" y="240" width="410" height="160" rx="6" fill="#131620" stroke="#2a3040"/>
