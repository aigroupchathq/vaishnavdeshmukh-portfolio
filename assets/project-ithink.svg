<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="ithink-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="brain-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(194,191,255,0.25)"/>
      <stop offset="50%" stop-color="rgba(135,98,240,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#ithink-bg)"/>

  <!-- Top App Navigation -->
  <rect x="30" y="24" width="900" height="50" rx="10" fill="#111122" stroke="#22223a" stroke-width="1"/>
  <circle cx="56" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="74" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="92" cy="49" r="6" fill="#27c93f"/>
  <text x="120" y="54" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">iTHINK</text>
  <text x="175" y="54" fill="#9aa0b0" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">| Notice your mind. Choose your next step.</text>
  <text x="760" y="54" fill="#c2bfff" font-family="'JetBrains Mono', monospace" font-size="11">WEBGL 3D ACTIVE</text>

  <!-- Mode Selector Bar (The 5 modes from actual iTHINK) -->
  <rect x="230" y="90" width="500" height="42" rx="21" fill="#141428" stroke="#282846" stroke-width="1"/>
  <rect x="235" y="94" width="100" height="34" rx="17" fill="#8762f0"/>
  <text x="255" y="116" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Whole Brain</text>
  <text x="355" y="116" fill="#a0a0c0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Networks</text>
  <text x="440" y="116" fill="#a0a0c0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Highways</text>
  <text x="525" y="116" fill="#a0a0c0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Synapse</text>
  <text x="610" y="116" fill="#a0a0c0" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Flow State</text>

  <!-- Left Sidebar: Cognitive Science Notes -->
  <rect x="30" y="150" width="240" height="360" rx="12" fill="#0f0f1e" stroke="#20203a" stroke-width="1"/>
  <text x="50" y="185" fill="#c2bfff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">01 · WHOLE BRAIN MODE</text>
  <text x="50" y="215" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">Signals spark &amp; connect.</text>
  <text x="50" y="245" fill="#8a8aab" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Activity appears across brain regions, passing along coordinated neural pathways.</text>
  
  <rect x="50" y="320" width="200" height="80" rx="8" fill="#14142a" stroke="#282848" stroke-width="1"/>
  <text x="64" y="348" fill="#9aa0b0" font-family="'JetBrains Mono', monospace" font-size="10">SYNAPSE COMM:</text>
  <text x="64" y="375" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">Neurotransmitters</text>

  <!-- Center Stage: 3D Glowing Brain Model Rendering -->
  <circle cx="500" cy="330" r="160" fill="url(#brain-glow)"/>
  
  <!-- Stylized Neural Cortical Lobes & Glowing Tracts -->
  <g stroke="#c2bfff" stroke-width="2" fill="none" opacity="0.85">
    <!-- Outer brain contours -->
    <path d="M 400 240 C 420 200, 480 190, 540 210 C 600 230, 640 280, 620 340 C 600 400, 550 430, 490 430 C 430 430, 390 390, 380 340 C 370 290, 380 260, 400 240 Z" stroke="#8762f0" stroke-width="2.5"/>
    <path d="M 420 270 Q 460 250 500 280 T 580 270 Q 610 320 570 360 T 480 390 Q 420 370 420 270"/>
    <path d="M 460 220 Q 520 250 550 310 T 520 410"/>
    <path d="M 400 310 Q 470 330 520 290 T 600 330"/>
  </g>

  <!-- Glowing synaptic points -->
  <g fill="#3ae4af">
    <circle cx="430" cy="260" r="4"/><circle cx="490" cy="230" r="5"/><circle cx="560" cy="250" r="4"/>
    <circle cx="480" cy="300" r="6"/><circle cx="540" cy="320" r="5"/><circle cx="440" cy="350" r="4"/>
    <circle cx="510" cy="380" r="5"/><circle cx="580" cy="350" r="4"/>
  </g>

  <!-- Right Sidebar: Brainwave Rhythms from actual iTHINK -->
  <rect x="730" y="150" width="200" height="360" rx="12" fill="#0f0f1e" stroke="#20203a" stroke-width="1"/>
  <text x="750" y="185" fill="#c2bfff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">EEG SPECTRUM</text>
  
  <text x="750" y="220" fill="#9585ff" font-family="'JetBrains Mono', monospace" font-size="11">Delta · 0.5–4 Hz</text>
  <path d="M 750 235 Q 770 225 790 235 T 830 235 T 870 235 T 900 235" stroke="#9585ff" stroke-width="2" fill="none"/>

  <text x="750" y="275" fill="#65c8ff" font-family="'JetBrains Mono', monospace" font-size="11">Theta · 4–8 Hz</text>
  <path d="M 750 290 Q 765 280 780 290 T 810 290 T 840 290 T 870 290 T 900 290" stroke="#65c8ff" stroke-width="2" fill="none"/>

  <text x="750" y="330" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="11">Alpha · 8–13 Hz</text>
  <path d="M 750 345 Q 760 335 770 345 T 790 345 T 810 345 T 830 345 T 850 345 T 870 345 T 890 345 T 910 345" stroke="#3ae4af" stroke-width="2" fill="none"/>

  <text x="750" y="385" fill="#ffc26f" font-family="'JetBrains Mono', monospace" font-size="11">Beta · 13–30 Hz</text>
  <path d="M 750 400 Q 755 390 760 400 T 770 400 T 780 400 T 790 400 T 800 400 T 810 400 T 820 400 T 830 400 T 840 400 T 850 400 T 860 400 T 870 400 T 880 400 T 890 400 T 900 400" stroke="#ffc26f" stroke-width="1.5" fill="none"/>

  <text x="750" y="440" fill="#ff83bd" font-family="'JetBrains Mono', monospace" font-size="11">Gamma · ≈30–80 Hz</text>
  <path d="M 750 455 Q 753 448 756 455 T 762 455 T 768 455 T 774 455 T 780 455 T 786 455 T 792 455 T 798 455 T 804 455 T 810 455 T 816 455 T 822 455 T 828 455 T 834 455 T 840 455 T 846 455 T 852 455 T 858 455 T 864 455 T 870 455 T 876 455 T 882 455 T 888 455 T 894 455 T 900 455" stroke="#ff83bd" stroke-width="1.5" fill="none"/>
</svg>
