<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="itsyou-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18131d"/>
      <stop offset="100%" stop-color="#0a080d"/>
    </linearGradient>
    <radialGradient id="calm-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd3be"/>
      <stop offset="55%" stop-color="#ff7e56"/>
      <stop offset="90%" stop-color="#551a08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" fill="url(#itsyou-bg)"/>

  <!-- Top bar -->
  <rect x="30" y="24" width="900" height="50" rx="10" fill="#201928" stroke="#332740" stroke-width="1"/>
  <circle cx="56" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="74" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="92" cy="49" r="6" fill="#27c93f"/>
  <text x="120" y="54" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">IT’S YOU</text>
  <text x="195" y="54" fill="#a89db5" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">| A Calm Space to Pause &amp; Make Deliberate Choices</text>
  <text x="760" y="54" fill="#ff7e56" font-family="'JetBrains Mono', monospace" font-size="11">MINDFULNESS WORKSPACE</text>

  <!-- Left: Guided Reflection Journal -->
  <rect x="30" y="90" width="460" height="420" rx="12" fill="#1b1422" stroke="#2e213b" stroke-width="1"/>
  <text x="54" y="125" fill="#a89db5" font-family="'JetBrains Mono', monospace" font-size="11">STEP 01 · NOTICE THE PATTERN</text>
  
  <rect x="54" y="145" width="412" height="150" rx="8" fill="#130d19" stroke="#251a30" stroke-width="1"/>
  <text x="70" y="175" fill="#ffd3be" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">"What is occupying your attention right now?"</text>
  <text x="70" y="210" fill="#ded5e8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">An urgent feeling to respond immediately to an email, before understanding the real root cause.</text>
  <text x="70" y="250" fill="#ff7e56" font-family="'JetBrains Mono', monospace" font-size="11">● CATEGORY: AUTOMATIC REACTIVITY (RECOGNIZED)</text>

  <!-- 3-stage reflection cards -->
  <g transform="translate(54, 315)">
    <rect x="0" y="0" width="130" height="90" rx="6" fill="#231a2d" stroke="#3b2b4d" stroke-width="1"/>
    <text x="12" y="24" fill="#ff7e56" font-family="'JetBrains Mono', monospace" font-size="10">01 / NOTICE</text>
    <text x="12" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Feel the urge</text>
    <text x="12" y="72" fill="#a89db5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Step back 1 breath</text>

    <rect x="140" y="0" width="130" height="90" rx="6" fill="#231a2d" stroke="#3b2b4d" stroke-width="1"/>
    <text x="152" y="24" fill="#c2bfff" font-family="'JetBrains Mono', monospace" font-size="10">02 / NAME</text>
    <text x="152" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Name without blame</text>
    <text x="152" y="72" fill="#a89db5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">"It's just a feeling"</text>

    <rect x="280" y="0" width="130" height="90" rx="6" fill="#231a2d" stroke="#3b2b4d" stroke-width="1"/>
    <text x="292" y="24" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="10">03 / CHOOSE</text>
    <text x="292" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Take next action</text>
    <text x="292" y="72" fill="#a89db5" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Deliberate intent</text>
  </g>

  <!-- Right: Calm Breathing Orb Canvas -->
  <rect x="510" y="90" width="420" height="420" rx="12" fill="#1b1422" stroke="#2e213b" stroke-width="1"/>
  <text x="534" y="125" fill="#a89db5" font-family="'JetBrains Mono', monospace" font-size="11">RHYTHMIC BREATHING ANCHOR</text>

  <circle cx="720" cy="270" r="140" fill="none" stroke="rgba(255,126,86,0.15)" stroke-width="2"/>
  <circle cx="720" cy="270" r="105" fill="none" stroke="rgba(255,126,86,0.25)" stroke-width="2" stroke-dasharray="4,6"/>
  <circle cx="720" cy="270" r="75" fill="url(#calm-orb)"/>
  
  <text x="720" y="278" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" text-anchor="middle">you</text>

  <text x="720" y="420" fill="#ffd3be" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">"What could change if you made space between</text>
  <text x="720" y="442" fill="#ffd3be" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">a feeling and a response?"</text>
  <text x="720" y="475" fill="#ff7e56" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">4s INHALE · 4s HOLD · 4s EXHALE</text>
</svg>
