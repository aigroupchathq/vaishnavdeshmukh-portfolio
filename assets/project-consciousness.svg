<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="chron-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090a"/>
      <stop offset="50%" stop-color="#0e1012"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="45%" stop-color="rgba(210,225,235,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#a0abb5" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3a424a" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#chron-bg)"/>

  <!-- Subtle Precision Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="540"/>
    <line x1="280" y1="0" x2="280" y2="540"/>
    <line x1="480" y1="0" x2="480" y2="540"/>
    <line x1="680" y1="0" x2="680" y2="540"/>
    <line x1="880" y1="0" x2="880" y2="540"/>
    <line x1="0" y1="100" x2="960" y2="100"/>
    <line x1="0" y1="270" x2="960" y2="270"/>
    <line x1="0" y1="440" x2="960" y2="440"/>
  </g>

  <!-- Top App Frame Header -->
  <rect x="30" y="24" width="900" height="48" rx="10" fill="#0f1114" stroke="#1f242a" stroke-width="1"/>
  <circle cx="56" cy="48" r="5.5" fill="#ff5f56"/>
  <circle cx="74" cy="48" r="5.5" fill="#ffbd2e"/>
  <circle cx="92" cy="48" r="5.5" fill="#27c93f"/>
  <text x="120" y="53" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" letter-spacing="0.05em">THE UNEXPLORED INTERIOR</text>
  <text x="325" y="53" fill="#6f7985" font-family="'JetBrains Mono', monospace" font-size="11">COGNITIVE PHENOMENOLOGICAL BENCHMARK</text>
  <rect x="735" y="34" width="180" height="28" rx="14" fill="#171b20" stroke="#2e353f" stroke-width="1"/>
  <circle cx="752" cy="48" r="3.5" fill="#3ae4af"/>
  <text x="765" y="52" fill="#d0d7de" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">IIT 4.0 ENGINE · LIVE</text>

  <!-- Left Telemetry Column -->
  <rect x="30" y="90" width="230" height="420" rx="12" fill="#0d0e11" stroke="#1d2127" stroke-width="1"/>
  <text x="48" y="122" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.1em">NEURO-DIAGNOSTIC TELEMETRY</text>
  
  <rect x="48" y="140" width="194" height="64" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="60" y="162" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">INTEGRATED INFO PHI (Φ)</text>
  <text x="60" y="190" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">4.82 <tspan font-size="11" fill="#3ae4af" font-weight="500">bits/state</tspan></text>

  <rect x="48" y="216" width="194" height="64" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="60" y="238" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">ATTENTIONAL BANDWIDTH</text>
  <text x="60" y="266" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800">120 <tspan font-size="11" fill="#8dbfd1" font-weight="500">bps (GNW)</tspan></text>

  <rect x="48" y="292" width="194" height="64" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="60" y="314" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">BINAURAL AUDITORY ENGINE</text>
  <text x="60" y="342" fill="#f0f6fc" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">528 Hz <tspan font-size="10" fill="#b7a4eb" font-weight="500">Solfeggio Bell</tspan></text>

  <rect x="48" y="368" width="194" height="122" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="60" y="390" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">NEURAL TAXONOMY</text>
  <text x="60" y="412" fill="#c9d1d9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">5 Empirical Paradigms</text>
  <text x="60" y="432" fill="#8b949e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">· Flicker Change Blindness</text>
  <text x="60" y="448" fill="#8b949e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">· Motion-Induced Blindness</text>
  <text x="60" y="464" fill="#8b949e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">· Continuous Flash Suppression</text>
  <text x="60" y="480" fill="#8b949e" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">· Bistable Necker &amp; Rivalry</text>

  <!-- Center Stage: 3D Gyroscopic Chronometer Core -->
  <circle cx="485" cy="300" r="170" fill="url(#core-glow)"/>

  <!-- Outer Gyroscopic Gimbal Rings -->
  <g transform="translate(485, 300)">
    <!-- Ring 1: Equatorial Outer Ring -->
    <ellipse cx="0" cy="0" rx="145" ry="50" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="145" ry="50" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 14" opacity="0.6" transform="rotate(-15)"/>
    
    <!-- Ring 2: Polar Meridian Ring -->
    <ellipse cx="0" cy="0" rx="55" ry="145" fill="none" stroke="url(#ring-grad)" stroke-width="2.5" transform="rotate(25)"/>
    <ellipse cx="0" cy="0" rx="55" ry="145" fill="none" stroke="#8dbfd1" stroke-width="1" stroke-dasharray="4 10" opacity="0.5" transform="rotate(25)"/>

    <!-- Ring 3: Oblique Precession Ring -->
    <ellipse cx="0" cy="0" rx="125" ry="85" fill="none" stroke="#485460" stroke-width="1.8" stroke-dasharray="2 6" transform="rotate(55)"/>

    <!-- Radial Tick Marks & Coordinate Reticle -->
    <circle cx="0" cy="0" r="158" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 8"/>
    <line x1="-165" y1="0" x2="-148" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="148" y1="0" x2="165" y2="0" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="-165" x2="0" y2="-148" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>
    <line x1="0" y1="148" x2="0" y2="165" stroke="#ffffff" stroke-width="1.5" opacity="0.7"/>

    <!-- Crystalline Core Octahedron / Diamond Wireframe -->
    <g stroke="#ffffff" stroke-width="2" fill="rgba(255,255,255,0.06)">
      <!-- Top apex to equator -->
      <polygon points="0,-48 -32,0 0,16 32,0" fill="rgba(255,255,255,0.12)"/>
      <polygon points="0,48 -32,0 0,16 32,0" fill="rgba(255,255,255,0.04)"/>
      <line x1="0" y1="-48" x2="0" y2="48" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>
      <line x1="-32" y1="0" x2="32" y2="0" stroke="#ffffff" stroke-width="2"/>
    </g>

    <!-- Center Pulse Core -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#subtle-blur)" opacity="0.8"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>

    <!-- Dynamic Orbiting Telemetry Nodes -->
    <circle cx="-135" cy="-28" r="4.5" fill="#3ae4af"/>
    <circle cx="120" cy="45" r="4" fill="#b7a4eb"/>
    <circle cx="28" cy="-140" r="3.5" fill="#8dbfd1"/>
  </g>

  <!-- Right Interactive Modules Column -->
  <rect x="700" y="90" width="230" height="420" rx="12" fill="#0d0e11" stroke="#1d2127" stroke-width="1"/>
  <text x="718" y="122" fill="#8b949e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.1em">EXPERIMENT CONTROLS</text>

  <!-- Module Cards -->
  <rect x="718" y="140" width="194" height="60" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="730" y="162" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">01. Flicker Change Blindness</text>
  <text x="730" y="182" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">Temporal Saccade Mask · 240ms</text>

  <rect x="718" y="210" width="194" height="60" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="730" y="232" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">02. Motion Blindness (MIB)</text>
  <text x="730" y="252" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">Cortical Gain Suppression · V1/V5</text>

  <rect x="718" y="280" width="194" height="60" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="730" y="302" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">03. Bistable Necker Cube</text>
  <text x="730" y="322" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">Predictive Bayesian Rivalry</text>

  <rect x="718" y="350" width="194" height="60" rx="8" fill="#13161a" stroke="#262c35" stroke-width="1"/>
  <text x="730" y="372" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">04. Continuous Flash Suppr.</text>
  <text x="730" y="392" fill="#6e7681" font-family="'JetBrains Mono', monospace" font-size="9">High-Entropy Mondrian Mask 10Hz</text>

  <!-- CTA Preview Button -->
  <rect x="718" y="424" width="194" height="42" rx="8" fill="#f0f6fc" stroke="#ffffff" stroke-width="1"/>
  <text x="815" y="450" fill="#0d1117" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="0.05em">WAKE UP THE OBSERVER →</text>
</svg>
