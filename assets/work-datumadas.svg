<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img">
  <rect width="960" height="600" fill="#080a0d"/>
  <path d="M38 38h884v524H38z" fill="none" stroke="#22262e"/>
  <text x="76" y="98" fill="#a1a1aa" font-family="monospace" font-size="14" letter-spacing="3">AUTOMOTIVE SYSTEMS // ADAS PERCEPTION UNIT</text>
  <text x="76" y="160" fill="#ffffff" font-family="Arial,sans-serif" font-size="36" font-weight="700">Perception, With Restraint.</text>
  <text x="76" y="199" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="17">On-device edge telemetry, forward collision</text>
  <text x="76" y="226" fill="#a1a1aa" font-family="Arial,sans-serif" font-size="17">awareness and kinematic trajectory estimation.</text>
  <path d="M76 267h270" stroke="#333842"/>
  <text x="76" y="300" fill="#e4e4e7" font-family="monospace" font-size="13" letter-spacing="2">RADAR // TELEMETRY CONSOLE</text>
  
  <!-- Radar/HUD Grid -->
  <g transform="translate(420 80)">
    <rect width="480" height="440" fill="#0c0e14" stroke="#272b36" rx="8"/>
    <!-- Horizon Line -->
    <line x1="20" y1="220" x2="460" y2="220" stroke="#333947" stroke-dasharray="4 6"/>
    <!-- Road Perspective -->
    <polygon points="240,220 80,420 400,420" fill="#131722" stroke="#252b3b"/>
    <!-- Lane divider -->
    <line x1="240" y1="220" x2="240" y2="420" stroke="#ffffff" stroke-width="3" stroke-dasharray="14 14"/>
    <!-- Vehicle bounding box -->
    <rect x="200" y="260" width="80" height="60" fill="#1b212f" stroke="#ffffff" stroke-width="2"/>
    <text x="208" y="280" fill="#ffffff" font-family="monospace" font-size="10">OBJ: LEAD_CAR</text>
    <text x="208" y="296" fill="#a1a1aa" font-family="monospace" font-size="9">DIST: 24.8m</text>
    <text x="208" y="310" fill="#ffffff" font-family="monospace" font-size="9">ΔV: -0.4 m/s</text>
    <!-- Radar Arc -->
    <path d="M 120 380 A 160 160 0 0 1 360 380" fill="none" stroke="#525866" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="M 160 340 A 110 110 0 0 1 320 340" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Telemetry Badges -->
    <rect x="40" y="40" width="120" height="32" rx="4" fill="#171b26" stroke="#333947"/>
    <text x="50" y="60" fill="#ffffff" font-family="monospace" font-size="11">FPS: 60.0 (EDGE)</text>
    <rect x="320" y="40" width="120" height="32" rx="4" fill="#171b26" stroke="#333947"/>
    <text x="330" y="60" fill="#ffffff" font-family="monospace" font-size="11">LATENCY: 11ms</text>
  </g>
</svg>