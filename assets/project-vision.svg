<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="vision-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141f"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#vision-grad)"/>

  <!-- Top bar -->
  <rect x="30" y="24" width="900" height="50" rx="10" fill="#0f1f2e" stroke="#1d364d" stroke-width="1"/>
  <circle cx="56" cy="49" r="6" fill="#ff5f56"/>
  <circle cx="74" cy="49" r="6" fill="#ffbd2e"/>
  <circle cx="92" cy="49" r="6" fill="#27c93f"/>
  <text x="120" y="54" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">VISION <tspan fill="#60b5ff">AI GUIDE</tspan></text>
  <text x="245" y="54" fill="#88a8c4" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">| Practical Foundations for Building with Language Models</text>
  <text x="760" y="54" fill="#60b5ff" font-family="'JetBrains Mono', monospace" font-size="11">OPEN CURRICULUM</text>

  <!-- Left: Guided Learning Path -->
  <rect x="30" y="90" width="430" height="420" rx="12" fill="#0d1b28" stroke="#1c344a" stroke-width="1"/>
  <text x="54" y="125" fill="#88a8c4" font-family="'JetBrains Mono', monospace" font-size="11">CURRICULUM · STEP-BY-STEP</text>
  
  <!-- Module 1 -->
  <rect x="54" y="145" width="382" height="74" rx="8" fill="#132638" stroke="rgba(96,181,255,0.3)" stroke-width="1"/>
  <circle cx="76" cy="172" r="10" fill="#60b5ff"/>
  <text x="73" y="176" fill="#09141f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">1</text>
  <text x="98" y="174" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Core LLM Mechanics &amp; Context</text>
  <text x="98" y="196" fill="#88a8c4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Attention windows, tokens, temperature, and hallucinations</text>

  <!-- Module 2 -->
  <rect x="54" y="232" width="382" height="74" rx="8" fill="#112232" stroke="#1e374e" stroke-width="1"/>
  <circle cx="76" cy="259" r="10" fill="#3ae4af"/>
  <text x="73" y="263" fill="#09141f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">2</text>
  <text x="98" y="261" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Prompt Scaffolding &amp; Grounding</text>
  <text x="98" y="283" fill="#88a8c4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Few-shot patterns, schema enforcement, system boundaries</text>

  <!-- Module 3 -->
  <rect x="54" y="319" width="382" height="74" rx="8" fill="#112232" stroke="#1e374e" stroke-width="1"/>
  <circle cx="76" cy="346" r="10" fill="#ff7e56"/>
  <text x="73" y="350" fill="#09141f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">3</text>
  <text x="98" y="348" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Human-in-the-Loop &amp; Evaluation</text>
  <text x="98" y="370" fill="#88a8c4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Judging output quality, edge cases, and safety thresholds</text>

  <!-- Module 4 -->
  <rect x="54" y="406" width="382" height="74" rx="8" fill="#112232" stroke="#1e374e" stroke-width="1"/>
  <circle cx="76" cy="433" r="10" fill="#c2bfff"/>
  <text x="73" y="437" fill="#09141f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">4</text>
  <text x="98" y="435" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Local-First Inference &amp; Privacy</text>
  <text x="98" y="457" fill="#88a8c4" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Running models on device without external API exposure</text>

  <!-- Right: Interactive Prompt Workbench -->
  <rect x="480" y="90" width="450" height="420" rx="12" fill="#0d1b28" stroke="#1c344a" stroke-width="1"/>
  <text x="504" y="125" fill="#88a8c4" font-family="'JetBrains Mono', monospace" font-size="11">INTERACTIVE PROMPT WORKBENCH</text>
  
  <rect x="504" y="145" width="402" height="180" rx="8" fill="#09131d" stroke="#182d3e" stroke-width="1"/>
  <text x="520" y="175" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="11">// System Prompt Blueprint</text>
  <text x="520" y="200" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">You are a clinical decision-support assistant.</text>
  <text x="520" y="222" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">Strict rule: never prescribe medications.</text>
  <text x="520" y="244" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">Format response strictly in HL7 JSON.</text>
  <text x="520" y="275" fill="#60b5ff" font-family="'JetBrains Mono', monospace" font-size="11">Input: "Patient ward transfer alert: Bed 14"</text>
  <text x="520" y="297" fill="#ff7e56" font-family="'JetBrains Mono', monospace" font-size="11">Output: { "resource": "Encounter", "status": "planned" }</text>

  <!-- Token and Evaluation Metrics -->
  <g transform="translate(504, 345)">
    <rect x="0" y="0" width="125" height="65" rx="6" fill="#132638" stroke="#1d364d" stroke-width="1"/>
    <text x="12" y="24" fill="#88a8c4" font-family="'JetBrains Mono', monospace" font-size="9">PROMPT TOKENS</text>
    <text x="12" y="48" fill="#60b5ff" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">142</text>

    <rect x="138" y="0" width="125" height="65" rx="6" fill="#132638" stroke="#1d364d" stroke-width="1"/>
    <text x="150" y="24" fill="#88a8c4" font-family="'JetBrains Mono', monospace" font-size="9">OUTPUT LATENCY</text>
    <text x="150" y="48" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">280 ms</text>

    <rect x="276" y="0" width="125" height="65" rx="6" fill="#132638" stroke="#1d364d" stroke-width="1"/>
    <text x="288" y="24" fill="#88a8c4" font-family="'JetBrains Mono', monospace" font-size="9">SCHEMA VALID</text>
    <text x="288" y="48" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">100%</text>
  </g>
</svg>
