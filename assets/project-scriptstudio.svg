    <rect x="140" y="-55" width="4" height="110" rx="2" fill="#3ae4af"/>
    <rect x="150" y="-30" width="4" height="60" rx="2" fill="#3ae4af"/>
    <rect x="160" y="-40" width="4" height="80" rx="2" fill="#3ae4af"/>
    <rect x="170" y="-20" width="4" height="40" rx="2" fill="#3ae4af"/>
    <rect x="180" y="-50" width="4" height="100" rx="2" fill="#3ae4af"/>
    <rect x="190" y="-30" width="4" height="60" rx="2" fill="#3ae4af"/>
    <rect x="200" y="-45" width="4" height="90" rx="2" fill="#3ae4af"/>
    <rect x="210" y="-15" width="4" height="30" rx="2" fill="#3ae4af"/>
    <rect x="220" y="-55" width="4" height="110" rx="2" fill="#3ae4af"/>
    <rect x="230" y="-35" width="4" height="70" rx="2" fill="#3ae4af"/>
    <rect x="240" y="-25" width="4" height="50" rx="2" fill="#3ae4af"/>
    <rect x="250" y="-40" width="4" height="80" rx="2" fill="#3ae4af"/>
    <rect x="260" y="-10" width="4" height="20" rx="2" fill="#3ae4af"/>
    <rect x="270" y="-50" width="4" height="100" rx="2" fill="#3ae4af"/>
    <rect x="280" y="-30" width="4" height="60" rx="2" fill="#3ae4af"/>
    <rect x="290" y="-45" width="4" height="90" rx="2" fill="#3ae4af"/>
    <rect x="300" y="-20" width="4" height="40" rx="2" fill="#3ae4af"/>
    <rect x="310" y="-60" width="4" height="120" rx="2" fill="#3ae4af"/>
    <rect x="320" y="-25" width="4" height="50" rx="2" fill="#3ae4af"/>
    <rect x="330" y="-40" width="4" height="80" rx="2" fill="#3ae4af"/>
    <rect x="340" y="-15" width="4" height="30" rx="2" fill="#3ae4af"/>
  </g>

  <!-- Voice simulation selector -->
  <g transform="translate(534, 320)">
    <rect x="0" y="0" width="372" height="165" rx="8" fill="#112428" stroke="#1c3d42" stroke-width="1"/>
    <text x="18" y="32" fill="#7ba8ad" font-family="'JetBrains Mono', monospace" font-size="11">DELIVERY PROFILE</text>
    <rect x="18" y="48" width="160" height="36" rx="6" fill="#3ae4af"/>
    <text x="32" y="71" fill="#050d0e" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Calm &amp; Articulate</text>

    <rect x="190" y="48" width="160" height="36" rx="6" fill="#152f34" stroke="#234a52" stroke-width="1"/>
    <text x="212" y="71" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">Narrative Pace</text>

    <text x="18" y="125" fill="#7ba8ad" font-family="'JetBrains Mono', monospace" font-size="11">FREQUENCY RESPONSE: 20 Hz – 20 kHz (FLAT)</text>
    <text x="18" y="145" fill="#3ae4af" font-family="'JetBrains Mono', monospace" font-size="11">SPEECH-TO-AUDIO BUFFER: SYNCED</text>
  </g>
</svg>
