<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img">
  <defs>
    <style>
      text {
        font-family: 'Archivo', 'Inter', -apple-system, sans-serif;
      }
      .telemetry {
        font-family: 'IBM Plex Mono', ui-monospace, monospace !important;
      }
      .serif-accent {
        font-family: 'Instrument Serif', Georgia, serif !important;
        font-style: italic;
      }
    </style>
  </defs>

  <rect width="960" height="600" fill="#0a0a0a"/>
  <path d="M38 38h884v524H38z" fill="none" stroke="#262626"/>
  <text x="76" y="98" fill="#a2a2a2" font-family="monospace" font-size="14" letter-spacing="3">COGNITIVE SYSTEMS // INSTITUTIONAL EDUCATION OS</text>
  <text x="76" y="160" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-size="36" font-weight="700">Vedic Tree OS</text>
  <text x="76" y="199" fill="#a2a2a2" font-family="'Inter', -apple-system, sans-serif" font-size="17">Multi-campus educational operating system combining</text>
  <text x="76" y="226" fill="#a2a2a2" font-family="'Inter', -apple-system, sans-serif" font-size="17">operational governance with human-centric student development.</text>
  <path d="M76 267h270" stroke="#383838"/>
  <text x="76" y="300" fill="#e4e4e4" font-family="monospace" font-size="13" letter-spacing="2">MULTI-TENANT // CAMPUS NETWORK</text>
  
  <g transform="translate(430 80)">
    <rect width="470" height="440" fill="#0e0e0e" stroke="#2b2b2b" rx="8"/>
    <!-- Central Node -->
    <circle cx="235" cy="180" r="35" fill="#1c1c1c" stroke="#ffffff" stroke-width="2"/>
    <text x="215" y="185" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">VT-CORE</text>
    
    <!-- Campus Nodes -->
    <circle cx="100" cy="90" r="24" fill="#161616" stroke="#a2a2a2"/>
    <text x="85" y="94" fill="#a2a2a2" font-family="monospace" font-size="9">CAMPUS 1</text>
    <line x1="120" y1="105" x2="210" y2="160" stroke="#383838"/>
    
    <circle cx="370" cy="90" r="24" fill="#161616" stroke="#a2a2a2"/>
    <text x="355" y="94" fill="#a2a2a2" font-family="monospace" font-size="9">CAMPUS 2</text>
    <line x1="350" y1="105" x2="260" y2="160" stroke="#383838"/>
    
    <circle cx="120" cy="300" r="24" fill="#161616" stroke="#a2a2a2"/>
    <text x="105" y="304" fill="#a2a2a2" font-family="monospace" font-size="9">CAMPUS 3</text>
    <line x1="135" y1="280" x2="215" y2="205" stroke="#383838"/>
    
    <circle cx="350" cy="300" r="24" fill="#161616" stroke="#a2a2a2"/>
    <text x="335" y="304" fill="#a2a2a2" font-family="monospace" font-size="9">CAMPUS 4</text>
    <line x1="335" y1="280" x2="255" y2="205" stroke="#383838"/>
    
    <!-- Telemetry Deck -->
    <rect x="40" y="360" width="390" height="50" rx="4" fill="#181818" stroke="#323232"/>
    <text x="60" y="390" fill="#ffffff" font-family="monospace" font-size="11">TENANTS: 24 NETWORKS · ROLES: RBAC CERTIFIED</text>
  </g>
</svg>