  <g font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3a0">
    <!-- Bed 01 -->
    <rect x="360" y="160" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="375" y="182" fill="#ffffff">BED 01</text>
    <circle cx="410" cy="195" r="4" fill="#3ae4af"/>
    
    <!-- Bed 02 -->
    <rect x="460" y="160" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="475" y="182" fill="#ffffff">BED 02</text>
    <circle cx="510" cy="195" r="4" fill="#3ae4af"/>

    <!-- Bed 03 -->
    <rect x="710" y="160" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="725" y="182" fill="#ffffff">BED 03</text>
    <circle cx="760" cy="195" r="4" fill="#3ae4af"/>

    <!-- Bed 04 -->
    <rect x="810" y="160" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="825" y="182" fill="#ffffff">BED 04</text>
    <circle cx="860" cy="195" r="4" fill="#3ae4af"/>

    <!-- Bed 05 -->
    <rect x="360" y="380" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="375" y="402" fill="#ffffff">BED 05</text>
    <circle cx="410" cy="415" r="4" fill="#60b5ff"/>

    <!-- Bed 06 -->
    <rect x="460" y="380" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="475" y="402" fill="#ffffff">BED 06</text>
    <circle cx="510" cy="415" r="4" fill="#3ae4af"/>

    <!-- Bed 07 -->
    <rect x="710" y="380" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="725" y="402" fill="#ffffff">BED 07</text>
    <circle cx="760" cy="415" r="4" fill="#3ae4af"/>

    <!-- Bed 08 -->
    <rect x="810" y="380" width="70" height="50" rx="6" fill="#15242d" stroke="#253a47" stroke-width="1"/>
    <text x="825" y="402" fill="#ffffff">BED 08</text>
    <circle cx="860" cy="415" r="4" fill="#ff7e56"/>
  </g>

  <!-- Live scan overlay badge -->
  <rect x="330" y="110" width="340" height="34" rx="6" fill="#14232c" stroke="#243845" stroke-width="1"/>
  <circle cx="348" cy="127" r="4" fill="#3ae4af"/>
  <text x="362" y="131" fill="#f3f6f5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LIVE SCAN: ST THOMAS' HOSPITAL · WARD 4B</text>
</svg>
