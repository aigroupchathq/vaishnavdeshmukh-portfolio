  <circle cx="620" cy="300" r="180" fill="none" stroke="#3ae4af" stroke-width="1" stroke-dasharray="4,6" opacity="0.4"/>
  <circle cx="620" cy="300" r="120" fill="none" stroke="#3ae4af" stroke-width="1" opacity="0.3"/>
  <circle cx="620" cy="300" r="60" fill="none" stroke="#3ae4af" stroke-width="1" opacity="0.5"/>
  <circle cx="620" cy="300" r="8" fill="#3ae4af"/>

