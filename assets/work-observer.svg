<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">The Observer reflection experience</title>
  <desc id="desc">A quiet interface with a prompt to notice, reflect, and choose.</desc>
  <rect width="960" height="600" fill="#0c0d12"/>
  <rect x="38" y="38" width="884" height="524" fill="#fbfaf7" stroke="#292929" stroke-width="2"/>
  <text x="76" y="91" fill="#55748b" font-family="Arial,sans-serif" font-size="14" letter-spacing="3">THE OBSERVER / THOUGHT &amp; AWARENESS</text>
  <text x="76" y="161" fill="#ffffff" font-family="Georgia,serif" font-size="46">What are you noticing?</text>
  <text x="76" y="202" fill="#5a5751" font-family="Arial,sans-serif" font-size="18">A small pause can make room for a different response.</text>
  <path d="M76 241h808" stroke="#c9c5bd"/>
  <g font-family="Arial,sans-serif">
    <rect x="76" y="282" width="244" height="174" fill="#fff" stroke="#292929"/>
    <text x="98" y="318" fill="#55748b" font-size="13" letter-spacing="2">01 / NOTICE</text>
    <text x="98" y="365" fill="#ffffff" font-size="23">What is here?</text>
    <path d="M98 393h180M98 413h144" stroke="#c9c5bd" stroke-width="2"/>
    <rect x="358" y="282" width="244" height="174" fill="#fff" stroke="#292929"/>
    <text x="380" y="318" fill="#55748b" font-size="13" letter-spacing="2">02 / REFLECT</text>
    <text x="380" y="365" fill="#ffffff" font-size="23">What matters?</text>
    <path d="M380 393h180M380 413h144" stroke="#c9c5bd" stroke-width="2"/>
    <rect x="640" y="282" width="244" height="174" fill="#fff" stroke="#292929"/>
    <text x="662" y="318" fill="#55748b" font-size="13" letter-spacing="2">03 / CHOOSE</text>
    <text x="662" y="365" fill="#ffffff" font-size="23">What next?</text>
    <path d="M662 393h180M662 413h144" stroke="#c9c5bd" stroke-width="2"/>
  </g>
  <text x="76" y="516" fill="#706c65" font-family="Georgia,serif" font-size="18" font-style="italic">A practice in curiosity, not diagnosis.</text>
</svg>
