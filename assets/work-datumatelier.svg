<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img">
  <defs>
    <style>
      text {
        font-family: 'Poppins', -apple-system, sans-serif;
      }
      .telemetry {
        font-family: 'IBM Plex Mono', ui-monospace, monospace !important;
      }
      .serif-accent {
        font-family: 'Instrument Serif', Georgia, serif !important;
        font-style: italic;
      }
    </style>
  </defs>

  <rect width="960" height="600" fill="#000000"/>
  <path d="M38 38h884v524H38z" fill="none" stroke="#262626"/>
  <text x="76" y="98" fill="#a2a2a2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" letter-spacing="2">AUTOMOTIVE // VEHICLE RECORDS</text>
  <text x="76" y="160" fill="#ffffff" font-family="'Poppins', -apple-system, sans-serif" font-size="36" font-weight="600">Datum Atelier</text>
  <text x="76" y="204" fill="#d4d4d8" font-family="'Poppins', -apple-system, sans-serif" font-size="16">Vehicle service invoices and</text>
  <text x="76" y="230" fill="#d4d4d8" font-family="'Poppins', -apple-system, sans-serif" font-size="16">handover records kept with</text>
  <text x="76" y="256" fill="#d4d4d8" font-family="'Poppins', -apple-system, sans-serif" font-size="16">the car across owners.</text>
  <path d="M76 292h290" stroke="#383838"/>
  <text x="76" y="324" fill="#e4e4e4" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" letter-spacing="2">HISTORY // CHASSIS RECORD</text>
  
  <g transform="translate(430 80)">
    <rect width="454" height="440" fill="#0c0c0e" stroke="#2b2b2b" rx="8"/>
    <!-- Vehicle Silhouette Outline -->
    <path d="M 54 210 L 112 170 L 210 140 L 310 140 L 380 180 L 418 210 L 418 250 L 54 250 Z" fill="#161619" stroke="#ffffff" stroke-width="2"/>
    <circle cx="122" cy="250" r="28" fill="#0c0c0e" stroke="#ffffff" stroke-width="3"/>
    <circle cx="348" cy="250" r="28" fill="#0c0c0e" stroke="#ffffff" stroke-width="3"/>
    
    <!-- Ledger Block Entries -->
    <rect x="34" y="310" width="386" height="98" rx="6" fill="#141417" stroke="#333333"/>
    <text x="52" y="340" fill="#ffffff" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11">CHASSIS LEDGER · VERIFIED ENTRY</text>
    <line x1="52" y1="355" x2="398" y2="355" stroke="#2c2c2c"/>
    <text x="52" y="375" fill="#a2a2a2" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10">HANDOVER: OWNER-HELD RECORD</text>
    <text x="52" y="394" fill="#d4d4d8" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10">INVOICES &amp; INSPECTIONS ARCHIVED</text>
  </g>
